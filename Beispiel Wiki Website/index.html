    .warning-box-warning {

    }
    .infobox {

      width: 280px;
      margin: 0 0 1rem 1.5rem;

      border: 2px solid rgba(139, 92, 246, 0.4);
      border-radius: 0.75rem;

      word-wrap: break-word;

  <script>
    function toggleInfobox(infoboxId) {
      const content = document.getElementById(infoboxId);
      const icon = content.previousElementSibling.querySelector('.infobox-toggle-icon');
      
      content.classList.toggle('collapsed');
      icon.classList.toggle('collapsed');
    }

    function generateInfoboxesHtml(page) {
      if (!page || !page.infoboxes || page.infoboxes.length === 0) {
        return '';
      }

      let html = '';
      page.infoboxes.forEach((infobox, index) => {
        const infoboxId = `infobox-${index}-${Math.random().toString(36).substr(2, 9)}`;
        html += `
          <div class="infobox">
            <div class="infobox-header" onclick="toggleInfobox('${infoboxId}')">
              <span>${infobox.title}</span>
              <svg class="infobox-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
            <div class="infobox-content" id="${infoboxId}">
        `;

        if (infobox.rows && infobox.rows.length > 0) {
          infobox.rows.forEach(row => {
            html += `
              <div class="infobox-row">

    function getRecentEditClockIcon(editedDate, size = 'medium') {
      const lastEdited = new Date(editedDate);
      const now = new Date();
      const daysDiff = Math.floor((now - lastEdited) / (1000 * 60 * 60 * 24));
      
      // Only show for edits within last 30 days
      if (daysDiff > 30) {
        return '';
      }
      
      let color = '';
      if (daysDiff <= 1) {
        color = 'text-blue-500'; // 0-1 days: Blue
      } else if (daysDiff <= 3) {
        color = 'text-green-500'; // 2-3 days: Green
      } else if (daysDiff <= 7) {
        color = 'text-yellow-500'; // 4-7 days: Yellow
      } else if (daysDiff <= 15) {
        color = 'text-orange-500'; // 8-15 days: Orange
      } else {
        color = 'text-red-500'; // 16-30 days: Red
      }
      
      // Size variants with stroke widths
      let sizeClass = 'w-5 h-5'; // default medium
      let strokeWidth = '1.5';
      if (size === 'small') {
        sizeClass = 'w-4 h-4';
        strokeWidth = '1.5';
      } else if (size === 'large') {
        sizeClass = 'w-10 h-10';
        strokeWidth = '2.2';
      }
      
      return `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="${strokeWidth}" stroke="currentColor" class="inline ${sizeClass} ${color} mr-1" style="vertical-align: text-bottom;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`;

    function generateWarnings(page, pageId) {
      if (!page || page.redirectTo || pageId === 'hauptseite' || pageId === 'alle-seiten' || pageId === 'wichtige-seiten' || pageId === 'kategorien' || pageId.startsWith('category-')) {
        return '';
      }
      
      const warnings = [];
      
      // Auto-generated warnings
      
      // 1. Check content length (excluding HTML tags and whitespace)
      const charCount = stripHtmlTags(page.content || '').length;
      
      if (charCount >= 50000) {
        warnings.push({
          type: 'error',
          text: `Diese Seite ist extrem lang (${charCount.toLocaleString('de-DE')} Zeichen) und könnte lange Ladezeiten verursachen. Erwägen Sie, den Inhalt auf mehrere Seiten aufzuteilen.`
        });
      } else if (charCount >= 25000) {
        warnings.push({
          type: 'warning',
          text: `Diese Seite ist sehr umfangreich (${charCount.toLocaleString('de-DE')} Zeichen). Das Laden könnte etwas länger dauern.`
        });
      } else if (charCount >= 10000) {
        warnings.push({
          type: 'warning',
          text: `Diese Seite enthält viel Inhalt (${charCount.toLocaleString('de-DE')} Zeichen). Verwenden Sie das Inhaltsverzeichnis zur Navigation.`
        });
      } else if (charCount >= 5000) {
        warnings.push({
          type: 'info',
          text: `Diese Seite ist umfangreich (${charCount.toLocaleString('de-DE')} Zeichen). Scrollen Sie nach unten für mehr Inhalt.`
        });
      } else if (charCount >= 2000) {
        warnings.push({
          type: 'info',
          text: `Diese Seite enthält ${charCount.toLocaleString('de-DE')} Zeichen Inhalt.`
        });
      }
      
      // 2. Check structure (250+ chars without HTML tag)
      const htmlContent = page.content || '';
      const segments = htmlContent.split(/<[^>]+>/);
      let hasLongSegment = false;
      for (const segment of segments) {
        const segmentText = segment.trim();
        if (segmentText.length >= 250) {
          hasLongSegment = true;
          break;
        }
      }
      
      if (hasLongSegment) {
        warnings.push({
          type: 'warning',
          text: 'Diese Seite ist nicht gut strukturiert. Längere Textabschnitte sollten mit Überschriften oder Absätzen unterteilt werden.'
        });
      }
      
      // 3. Check last edited date
      if (page.edited) {
        const lastEdited = new Date(page.edited);
        const now = new Date();
        const daysDiff = Math.floor((now - lastEdited) / (1000 * 60 * 60 * 24));
        
        if (daysDiff > 60) {
          warnings.push({
            type: 'warning',
            text: `Diese Seite wurde zuletzt vor ${daysDiff} Tagen bearbeitet und könnte veraltete Informationen enthalten.`
          });
        }
      }
      
      // Custom page warnings
      if (page.warnings && Array.isArray(page.warnings)) {
        warnings.push(...page.warnings);
      }
      
      // Generate HTML
      if (warnings.length === 0) {
        return '';
      }
      
      let html = '';
      for (const warning of warnings) {
        const typeClass = `warning-box-${warning.type || 'info'}`;
        let icon = '';
        
        if (warning.type === 'error') {
          icon = '<svg class="warning-box-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        } else if (warning.type === 'warning') {
          icon = '<svg class="warning-box-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
        } else {
          icon = '<svg class="warning-box-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
        }
        
        html += `<div class="warning-box ${typeClass}">${icon}<div>${warning.text}</div></div>`;
      }
      
      return html;
    }

    function updatePageTitle(pageTitle) {
      document.title = `${pageTitle} – Die 8b-Website`;
    }

    function renderPage(pageId) {
      // Check if it's a redirect page
      const page = pages[pageId];
      if (page && page.redirectTo) {
        // Automatically redirect to the target page
        navigateTo(page.redirectTo);
        return;
      }
      
      // Check if it's a sorted "alle-seiten" page
      if (pageId.startsWith('alle-seiten-')) {
        const sortBy = pageId.substring(12); // Remove "alle-seiten-"
        document.getElementById('page-title').textContent = 'Alle Seiten';
        updatePageTitle('Alle Seiten');
        document.getElementById('page-text').innerHTML = generateAllPagesContent(sortBy);
        updateSidebar(null, true);
        document.getElementById('btn-back').disabled = historyIndex <= 0;
        document.getElementById('btn-forward').disabled = historyIndex >= history.length - 1;
        return;
      }
      
      // Check if it's a sorted "wichtige-seiten" page
      if (pageId.startsWith('wichtige-seiten-')) {
        const sortBy = pageId.substring(16); // Remove "wichtige-seiten-"
        document.getElementById('page-title').textContent = 'Wichtige Seiten';
        updatePageTitle('Wichtige Seiten');
        document.getElementById('page-text').innerHTML = generateImportantPagesContent(sortBy);
        updateSidebar(null, true);
        document.getElementById('btn-back').disabled = historyIndex <= 0;
        document.getElementById('btn-forward').disabled = historyIndex >= history.length - 1;
        return;
      }
      
      // Check if it's a category page with sorting
      if (pageId.startsWith('category-')) {
        let sortBy = 'alpha';
        let categoryId = pageId.substring(9); // Remove 'category-'
        
        // Check if categoryId ends with a sort option
        const sortOptions = ['alpha', 'index', 'edited', 'created', 'length'];
        for (const opt of sortOptions) {
          if (categoryId.endsWith('-' + opt)) {
            sortBy = opt;
            categoryId = categoryId.substring(0, categoryId.length - opt.length - 1);
            break;
          }
        }
        
        const category = categories[categoryId];
        
        if (!category) {
          document.getElementById('page-title').textContent = 'Kategorie nicht gefunden';
          document.getElementById('page-text').innerHTML = '<p>Diese Kategorie existiert nicht.</p>';
          updateSidebar(null, true);
          return;
        }
        
        document.getElementById('page-title').innerHTML = `<span class="inline-flex items-center gap-2"><svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>${category.name}</span>`;
        document.getElementById('page-text').innerHTML = generateCategoryContent(categoryId, sortBy);
        
        // Update navigation buttons
        document.getElementById('btn-back').disabled = historyIndex <= 0;
        document.getElementById('btn-forward').disabled = historyIndex >= history.length - 1;
        
        updateSidebar(null, true);
        return;
      }
      
      if (!page) {
        document.getElementById('page-title').textContent = 'Seite nicht gefunden';
        updatePageTitle('Seite nicht gefunden');
        document.getElementById('page-text').innerHTML = '<p>Diese Seite existiert leider nicht. 😢</p>';
        updateSidebar(null, false);
        return;
      }

      // Set page title with important icon and/or clock icon if needed
      let titleHtml = '';
      
      // Add recent edit clock icon if applicable
      if (page.edited) {
        const clockIcon = getRecentEditClockIcon(page.edited, 'large');
        if (clockIcon) {
          titleHtml += clockIcon;
        }
      }
      
      // Add important icon if needed
      if (page.important) {
        titleHtml += `<svg class="w-8 h-8 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
      }
      
      // Set the final title
      if (titleHtml) {
        document.getElementById('page-title').innerHTML = `<span class="inline-flex items-center gap-3">${titleHtml}${page.title}</span>`;
      } else {
        document.getElementById('page-title').textContent = page.title;
      }
      
      updatePageTitle(page.title);
      
      if (pageId === 'hauptseite') {
        document.getElementById('page-title').textContent = 'Hauptseite';
        updatePageTitle('Hauptseite');
        document.getElementById('page-text').innerHTML = page.content;
        updateSidebar(page, false);
      } else if (pageId === 'alle-seiten') {
        document.getElementById('page-title').textContent = 'Alle Seiten';
        updatePageTitle('Alle Seiten');
        document.getElementById('page-text').innerHTML = generateAllPagesContent('alpha');
        updateSidebar(null, true);
      } else if (pageId === 'wichtige-seiten') {
        document.getElementById('page-title').textContent = 'Wichtige Seiten';
        updatePageTitle('Wichtige Seiten');
        document.getElementById('page-text').innerHTML = generateImportantPagesContent('alpha');
        updateSidebar(null, true);
      } else if (pageId === 'kategorien') {
        document.getElementById('page-title').textContent = 'Kategorien';
        updatePageTitle('Kategorien');
        document.getElementById('page-text').innerHTML = generateCategoriesContent();
        updateSidebar(null, true);
      } else {
        let html = '';
        
        // Add warnings at the top
        const warningsHtml = generateWarnings(page, pageId);
        if (warningsHtml) {
          html += warningsHtml;
        }
        
        // Add infoboxes
        const infoboxesHtml = generateInfoboxesHtml(page);
        if (infoboxesHtml) {
          html += infoboxesHtml;
        }
        
        // Add 8b-Index if present
        if (page.index || page.indexStats || page.indexProsCons) {
          let indexHtml = `<div class="infobox">`;
          
          // Header with toggle
          let headerText = '8b-INDEX';
          if (page.indexStats && page.indexStats.length > 0) headerText += ' & STATISTIKEN';
          if (page.indexProsCons) headerText += ' & PRO/KONTRA';
          const infoboxId = `infobox-${Math.random().toString(36).substr(2, 9)}`;
          indexHtml += `<div class="infobox-header" onclick="toggleInfobox('${infoboxId}')">
            <span>${headerText}</span>
            <svg class="infobox-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>`;
          
          indexHtml += `<div class="infobox-content" id="${infoboxId}">`;
          
          // Index section
          if (page.index) {
            const indexDesc = getIndexDescription(page.index);
            if (indexDesc) {
              indexHtml += `
                <div class="text-center mb-3 pb-3 border-b border-purple-500/20">
                  <div class="text-5xl font-bold text-purple-200 mb-2">${page.index}</div>
                  <div class="text-xs font-heading font-semibold text-purple-200">${indexDesc.text}</div>
                </div>
              `;
            }
          }
          
          // Stats section
          if (page.indexStats && page.indexStats.length > 0) {
            page.indexStats.forEach(stat => {
              indexHtml += `
                <div class="infobox-row">
                  <span class="infobox-label">${stat.label}:</span>
                  <span class="infobox-value">${stat.value}</span>
                </div>
              `;
            });
          }
          
          indexHtml += `</div></div>`;
          html += indexHtml;
        }
        
        // Add page content
        html += page.content;
        
        document.getElementById('page-text').innerHTML = html;
        updateSidebar(page, false);
      }

      // Update navigation buttons
      document.getElementById('btn-back').disabled = historyIndex <= 0;
      document.getElementById('btn-forward').disabled = historyIndex >= history.length - 1;
    }

    function scrollToHeading(headingText) {
      const pageText = document.getElementById('page-text');
      const headings = pageText.querySelectorAll('h2, h3');
      
      for (const heading of headings) {
        if (heading.textContent.trim() === headingText) {
          const mainContent = document.querySelector('main > div:first-child');
          const headerOffset = 20;
          const elementPosition = heading.getBoundingClientRect().top;
          const offsetPosition = elementPosition + mainContent.scrollTop - headerOffset;
          
          mainContent.scrollTo({
            top: offsetPosition,
            behavior: 'smooth'
          });
          break;
        }
      }
    }

    function updateSidebar(page, isSpecialPage) {
      // Update statistics
      if (!isSpecialPage && page) {
        const charCount = stripHtmlTags(page.content || '').length;
        
        document.getElementById('stat-chars').textContent = charCount.toLocaleString('de-DE');
        document.getElementById('stat-created').textContent = page.created ? formatDate(page.created) : '-';
        document.getElementById('stat-edited').textContent = page.edited ? formatDate(page.edited) : '-';
      } else {
        document.getElementById('stat-chars').textContent = '-';
        document.getElementById('stat-created').textContent = '-';
        document.getElementById('stat-edited').textContent = '-';
      }
      
      // Update categories
      const categoriesSection = document.getElementById('sidebar-categories');
      const categoriesList = document.getElementById('sidebar-categories-list');
      if (!isSpecialPage && page && page.categories && page.categories.length > 0) {
        categoriesList.innerHTML = page.categories.map(catId => {
          const cat = categories[catId];
          if (!cat) return '';
          return `
            <a href="#" onclick="event.preventDefault(); navigateTo('category-${catId}')" 
               class="flex items-center gap-2 px-3 py-2 bg-purple-900/30 hover:bg-purple-800/40 rounded-lg border border-purple-500/20 transition-all">
              <span class="text-purple-200">${cat.name}</span>

        categoriesSection.classList.remove('hidden');
      } else {
        categoriesSection.classList.add('hidden');
      }
      
      // Update table of contents
      const tocSection = document.getElementById('sidebar-toc');
      const tocList = document.getElementById('sidebar-toc-list');
      if (!isSpecialPage && page) {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = page.content;
        const headings = tempDiv.querySelectorAll('h2, h3');
        
        if (headings.length > 0) {
          let tocHtml = '';
          let h2Count = 0;
          let h3Count = 0;
          
          headings.forEach(heading => {
            const text = heading.textContent.trim();
            if (heading.tagName === 'H2') {
              h2Count++;
              h3Count = 0;
              tocHtml += `
                <div onclick="scrollToHeading('${text.replace(/'/g, "\\'")}')" class="text-purple-200 hover:text-purple-100 py-1 cursor-pointer transition-colors">
                  ${h2Count}. ${text}
                </div>
              `;
            } else if (heading.tagName === 'H3') {
              h3Count++;
              tocHtml += `
                <div onclick="scrollToHeading('${text.replace(/'/g, "\\'")}')" class="text-purple-300 hover:text-purple-200 py-1 pl-4 cursor-pointer transition-colors text-xs">
                  ${h2Count}.${h3Count}. ${text}
                </div>
              `;
            }
          });
          
          tocList.innerHTML = tocHtml;
          tocSection.classList.remove('hidden');
        } else {
          tocSection.classList.add('hidden');
        }
      } else {
        tocSection.classList.add('hidden');
      }
      
      // Update related pages
      const relatedSection = document.getElementById('sidebar-related');
      const relatedList = document.getElementById('sidebar-related-list');
      if (!isSpecialPage && page && page.related && page.related.length > 0) {
        relatedList.innerHTML = page.related.map(relatedId => {
          const relatedPage = pages[relatedId];
          if (!relatedPage) return '';
          return `
            <a href="#" onclick="event.preventDefault(); navigateTo('${relatedId}')" 
               class="flex items-center gap-2 px-3 py-2 bg-purple-900/30 hover:bg-purple-800/40 rounded-lg border border-purple-500/20 transition-all group">
              <svg class="w-4 h-4 text-purple-400 group-hover:text-purple-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
              <span class="text-purple-200 group-hover:text-purple-100 transition-colors">${relatedPage.title}</span>
            </a>
          `;
        }).join('');
        relatedSection.classList.remove('hidden');
      } else {
        relatedSection.classList.add('hidden');
      }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('de-DE', { 
        year: 'numeric', 
        month: '2-digit', 
        day: '2-digit' 
      });
    }

    function navigateTo(pageId) {
      if (pageId === currentPage) return;
      
      // Add to history
      if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
      }
      history.push(pageId);
      historyIndex = history.length - 1;
      
      currentPage = pageId;
      renderPage(pageId);
      
      // Scroll to top of content area
      const mainContent = document.querySelector('main > div:first-child');
      if (mainContent) {
        mainContent.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      }
      
      // Close search results
      document.getElementById('search-results').classList.add('hidden');
      document.getElementById('search-input').value = '';
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        currentPage = history[historyIndex];
        renderPage(currentPage);
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        currentPage = history[historyIndex];
        renderPage(currentPage);
      }
    }

    function openRandomPage() {
      const pageEntries = Object.entries(pages).filter(([id, page]) => 
        !page.redirectTo && 
        id !== 'hauptseite' &&
        id !== 'alle-seiten' &&
        id !== 'wichtige-seiten' &&
        id !== 'kategorien' &&
        !id.startsWith('category-') &&
        id !== currentPage
      );
      
      if (pageEntries.length === 0) return;
      
      // Calculate total weight
      const totalWeight = pageEntries.reduce((sum, [, page]) => sum + (page.weight || 1), 0);
      
      // Random selection based on weight
      let random = Math.random() * totalWeight;
      let selectedId = pageEntries[0][0];
      
      for (const [id, page] of pageEntries) {
        random -= (page.weight || 1);
        if (random <= 0) {
          selectedId = id;
          break;
        }
      }
      
      navigateTo(selectedId);
    }

    function toggleMenu() {
      menuOpen = !menuOpen;
      const dropdown = document.getElementById('menu-dropdown');
      const arrow = document.getElementById('menu-arrow');
      
      if (menuOpen) {
        dropdown.classList.remove('hidden');
        arrow.style.transform = 'rotate(180deg)';
      } else {
        dropdown.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function stripHtmlTags(html) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      const text = tempDiv.textContent || tempDiv.innerText || '';
      // Remove all whitespace and count only actual characters
      return text.replace(/\s+/g, '');
    }

    function handleSearch(query) {
      const resultsContainer = document.getElementById('search-results');
      
      if (!query.trim()) {
        resultsContainer.classList.add('hidden');
        return;
      }

      const searchLower = query.toLowerCase().trim();
      
      // Search in categories
      const categoryResults = Object.entries(categories)
        .filter(([id, cat]) => 
          cat.name.toLowerCase().includes(searchLower) ||
          cat.description.toLowerCase().includes(searchLower)
        )
        .map(([id, cat]) => {
          const titleLower = cat.name.toLowerCase();
          let matchType = 0;
          if (titleLower === searchLower) matchType = 3;
          else if (titleLower.startsWith(searchLower)) matchType = 2;
          else if (titleLower.includes(searchLower)) matchType = 1;
          
          return { 
            id: `category-${id}-alpha`, 
            title: cat.name, 
            type: 'category',
            matchType: matchType,
            edited: null,
            sortTitle: cat.name
          };
        });
      
      // Build a map of redirect pages to their target pages
      const redirectMap = new Map();
      Object.entries(pages).forEach(([id, page]) => {
        if (page.redirectTo) {
          if (!redirectMap.has(page.redirectTo)) {
            redirectMap.set(page.redirectTo, []);
          }
          redirectMap.get(page.redirectTo).push({ id, page });
        }
      });
      
      // Search in pages
      const pageResults = [];
      const processedIds = new Set(); // Track all processed IDs
      const processedTargets = new Set();
      
      Object.entries(pages).forEach(([id, page]) => {
        if (id === 'hauptseite' ||
            id === 'alle-seiten' ||
            id === 'wichtige-seiten' ||
            id === 'kategorien' ||
            processedIds.has(id)) { // Skip if already processed
          return;
        }
        
        const titleStripped = stripHtmlTags(page.title).toLowerCase();
        const contentStripped = page.content ? stripHtmlTags(page.content).toLowerCase() : '';
        
        let matchType = 0;
        let matchReason = '';
        
        // Check title matches
        if (titleStripped === searchLower) {
          matchType = 3;
          matchReason = 'title-exact';
        } else if (titleStripped.startsWith(searchLower)) {
          matchType = 2;
          matchReason = 'title-start';
        } else if (titleStripped.includes(searchLower)) {
          matchType = 1;
          matchReason = 'title-contains';
        }
        
        // Check related pages
        if (matchType === 0 && page.related) {
          for (const relatedId of page.related) {
            const relatedPage = pages[relatedId];
            if (relatedPage) {
              const relatedTitle = stripHtmlTags(relatedPage.title).toLowerCase();
              if (relatedTitle.includes(searchLower)) {
                matchType = 0.5;
                matchReason = 'related';
                break;
              }
            }
          }
        }
        
        // Check content
        if (matchType === 0 && contentStripped.includes(searchLower)) {
          matchType = 0.25;
          matchReason = 'content';
        }
        
        // If this is a redirect page
        if (page.redirectTo) {
          const targetPage = pages[page.redirectTo];
          if (targetPage && matchType > 0) {
            // Check if target already processed or matches
            const targetTitleStripped = stripHtmlTags(targetPage.title).toLowerCase();
            const targetContentStripped = targetPage.content ? stripHtmlTags(targetPage.content).toLowerCase() : '';
            
            const targetMatches = targetTitleStripped.includes(searchLower) || targetContentStripped.includes(searchLower);
            
            if (targetMatches && !processedTargets.has(page.redirectTo) && !processedIds.has(page.redirectTo)) {
              // Show target page instead
              processedTargets.add(page.redirectTo);
              processedIds.add(page.redirectTo);
              processedIds.add(id); // Mark this redirect as processed too
              
              let targetMatchType = 0;
              if (targetTitleStripped === searchLower) targetMatchType = 3;
              else if (targetTitleStripped.startsWith(searchLower)) targetMatchType = 2;
              else if (targetTitleStripped.includes(searchLower)) targetMatchType = 1;
              else if (targetContentStripped.includes(searchLower)) targetMatchType = 0.25;
              
              pageResults.push({
                id: page.redirectTo,
                title: targetPage.title,
                type: 'page',
                important: targetPage.important,
                redirectTo: false,
                matchType: Math.max(matchType, targetMatchType),
                edited: targetPage.edited,
                sortTitle: targetPage.title
              });
              return;
            }
            
            // Check other redirects to same target
            const otherRedirects = redirectMap.get(page.redirectTo) || [];
            const matchingRedirects = otherRedirects.filter(r => {
              const rTitle = stripHtmlTags(r.page.title).toLowerCase();
              return rTitle.includes(searchLower);
            });
            
            if (matchingRedirects.length >= 2) {
              // Show only one redirect
              const firstRedirect = matchingRedirects[0];
              if (id === firstRedirect.id) {
                processedIds.add(id);
                // Mark all other matching redirects as processed
                matchingRedirects.forEach(r => processedIds.add(r.id));
                
                pageResults.push({
                  id: id,
                  title: page.title,
                  type: 'page',
                  important: page.important,
                  redirectTo: true,
                  targetPage: page.redirectTo,
                  matchType: matchType,
                  edited: page.edited,
                  sortTitle: page.title
                });
              }
              return;
            }
          }
        }
        
        // Regular page or single matching redirect
        if (matchType > 0) {
          // Skip if this is a target that was already shown
          if (page.redirectTo && processedTargets.has(page.redirectTo)) {
            return;
          }
          
          processedIds.add(id);
          
          pageResults.push({
            id: id,
            title: page.title,
            type: 'page',
            important: page.important,
            redirectTo: page.redirectTo,
            matchType: matchType,
            edited: page.edited,
            sortTitle: page.title
          });
        }
      });
      
      // Combine and sort results
      const allResults = [...categoryResults, ...pageResults];
      
      allResults.sort((a, b) => {
        // 1. Match type (higher is better)
        if (a.matchType !== b.matchType) {
          return b.matchType - a.matchType;
        }
        
        // 2. Type priority: category > important > normal
        const getTypePriority = (result) => {
          if (result.type === 'category') return 3;
          if (result.important) return 2;
          return 1;
        };
        const aPriority = getTypePriority(a);
        const bPriority = getTypePriority(b);
        if (aPriority !== bPriority) {
          return bPriority - aPriority;
        }
        
        // 3. Last edited (newer first)
        if (a.edited && b.edited) {
          const aDate = new Date(a.edited);
          const bDate = new Date(b.edited);
          if (aDate.getTime() !== bDate.getTime()) {
            return bDate.getTime() - aDate.getTime();
          }
        } else if (a.edited && !b.edited) {
          return -1;
        } else if (!a.edited && b.edited) {
          return 1;
        }
        
        // 4. Alphabetical
        return a.sortTitle.localeCompare(b.sortTitle, 'de');
      });
      
      const results = allResults.slice(0, 8);

      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="px-4 py-3 text-gray-400">Keine Ergebnisse gefunden</div>';
      } else {
        resultsContainer.innerHTML = results.map(result => {
          const displayTitle = result.redirectTo ? 
            `${result.title} <span class="text-xs text-purple-400">→</span>` : 
            result.title;
          
          // Get clock icon for search results
          let clockIcon = '';
          if (result.edited) {
            clockIcon = getRecentEditClockIcon(result.edited, 'medium');
          }
          
          return `
          <button 
            onclick="navigateTo('${result.id}')" 
            class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors border-b border-purple-500/10 last:border-b-0"
          >
            <div class="font-medium text-purple-200 flex items-center gap-1">
              ${clockIcon}
              ${result.important ? '<svg class="inline w-4 h-4 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>' : ''}
              ${result.type === 'category' ? '<svg class="inline w-4 h-4 text-purple-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>' : ''}
              ${result.isRedirect ? '<svg class="inline w-4 h-4 text-indigo-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 9l3 3m0 0l-3 3m3-3H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' : ''}
              <span>${displayTitle}</span>
            </div>
          </button>
        `;
        }).join('');
      }

      resultsContainer.classList.remove('hidden');
    }

    function showSearchResults() {
      const query = document.getElementById('search-input').value;
      if (query.trim()) {
        handleSearch(query);
      }
    }
    
    function toggleSidebarSection(section) {
      sidebarState[section] = !sidebarState[section];
      const content = document.getElementById(`${section}-content`);
      const arrow = document.getElementById(`${section}-arrow`);
      
      if (sidebarState[section]) {
        content.style.display = 'block';
        arrow.style.transform = 'rotate(0deg)';
      } else {
        content.style.display = 'none';
        arrow.style.transform = 'rotate(-90deg)';
      }
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      const menuBtn = e.target.closest('button[onclick="toggleMenu()"]');
      const menuDropdown = document.getElementById('menu-dropdown');
      
      if (!menuBtn && !menuDropdown.contains(e.target) && menuOpen) {
        toggleMenu();
      }

      const searchContainer = e.target.closest('.relative');
      const searchResults = document.getElementById('search-results');
      if (!searchContainer && !searchResults.classList.contains('hidden')) {
        searchResults.classList.add('hidden');
      }
    });

    // ==================== INIT ====================
    function initMenuFavorites() {
      const container = document.getElementById('menu-favorites');
      container.innerHTML = menuFavorites.map(fav => {
        return `
          <button onclick="navigateTo('${fav.pageId}'); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              ${fav.icon}
            </svg>
            <span>${fav.title}</span>
          </button>
        `;
      }).join('');
    }

    initMenuFavorites();
    updatePageCount();
    renderPage('hauptseite');
