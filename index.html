<!doctype html>
<html lang="de" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Die 8b-Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
 </head>
 <body class="h-full font-body bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-gray-100 overflow-hidden">
  <div id="app" class="h-full flex flex-col">
   <!-- Header -->
   <header class="bg-slate-900/80 backdrop-blur-md border-b border-purple-500/30 px-4 py-3 flex items-center gap-4 flex-wrap relative z-50">
    <!-- Website Title -->
    <h1 id="site-title" class="font-heading font-bold text-xl bg-gradient-to-r from-purple-400 via-violet-400 to-indigo-400 bg-clip-text text-transparent whitespace-nowrap">Die 8b-Website</h1><!-- Navigation Buttons -->
    <div class="flex items-center gap-1">
     <button id="btn-back" onclick="goBack()" class="p-2 rounded-lg bg-purple-900/50 hover:bg-purple-800/60 disabled:opacity-40 disabled:cursor-not-allowed transition-all" title="Zurück">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg></button> <button id="btn-forward" onclick="goForward()" class="p-2 rounded-lg bg-purple-900/50 hover:bg-purple-800/60 disabled:opacity-40 disabled:cursor-not-allowed transition-all" title="Vorwärts">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg></button>
    </div><!-- Page Count -->
    <div class="flex items-center gap-2 px-3 py-1.5 bg-purple-900/40 rounded-lg border border-purple-500/20">
     <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
     </svg><span id="page-count" class="text-sm text-purple-200">0 Seiten</span>
    </div><!-- Search Bar -->
    <div class="flex-1 min-w-48 max-w-md relative">
     <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
     </svg><input type="text" id="search-input" placeholder="Seiten suchen..." oninput="handleSearch(this.value)" onfocus="showSearchResults()" class="w-full pl-10 pr-4 py-2 bg-slate-800/60 border border-purple-500/30 rounded-lg focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20 transition-all text-sm"> <!-- Search Results Dropdown -->
     <div id="search-results" class="absolute top-full left-0 right-0 mt-1 bg-slate-800/95 backdrop-blur-md border border-purple-500/30 rounded-lg shadow-xl max-h-64 overflow-y-auto hidden z-50">
     </div>
    </div><!-- Menu Dropdown -->
    <div class="relative">
     <button onclick="toggleMenu()" class="flex items-center gap-2 px-4 py-2 bg-purple-600/80 hover:bg-purple-500/80 rounded-lg transition-all font-heading font-medium"> <span>Durchsuchen</span>
      <svg class="w-4 h-4 transition-transform" id="menu-arrow" fill="none" stroke="currentColor" viewbox="0 0 24 24">
       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg></button>
     <div id="menu-dropdown" class="absolute right-0 top-full mt-2 w-56 bg-slate-800/95 backdrop-blur-md border border-purple-500/30 rounded-lg shadow-xl hidden z-50 overflow-hidden">
      <button onclick="navigateTo('hauptseite'); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
       <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
       </svg><span>Hauptseite</span> </button> <button onclick="openRandomPage(); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
       <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
       </svg><span>Zufällige Seite</span> </button> <button onclick="navigateTo('kategorien'); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
       <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
       </svg><span>Kategorien</span> </button> <button onclick="navigateTo('alle-seiten'); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
       <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
       </svg><span>Alle Seiten</span> </button> <button onclick="navigateTo('wichtige-seiten'); toggleMenu();" class="w-full px-4 py-3 text-left hover:bg-purple-600/30 transition-colors flex items-center gap-3">
       <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
       </svg><span>Wichtige Seiten</span> </button>
      <div class="border-t border-purple-500/30 my-1"></div>
      <div id="dropdown-pages">
      </div>
     </div>
    </div>
   </header><!-- Main Content -->
   <main class="flex-1 overflow-hidden flex gap-6 p-6">
    <!-- Page Content -->
    <div class="flex-1 overflow-y-auto pr-2">
     <div class="max-w-4xl">
      <article id="page-content" class="bg-slate-800/40 backdrop-blur-sm border border-purple-500/20 rounded-2xl p-8 shadow-2xl">
       <h1 id="page-title" class="font-heading text-4xl font-bold mb-6 bg-gradient-to-r from-purple-300 via-violet-300 to-indigo-300 bg-clip-text text-transparent" style="word-wrap: break-word; overflow-wrap: break-word; hyphens: auto;">Willkommen</h1>
       <div id="page-text" class="page-content text-gray-300 leading-relaxed" style="word-wrap: break-word; overflow-wrap: break-word; hyphens: auto; max-width: 100%;">
        Lade...
       </div>
      </article>
     </div>
    </div><!-- Sidebar -->
    <aside class="w-48 sm:w-56 md:w-64 lg:w-80 xl:w-96 flex-shrink-0 overflow-y-auto pl-2">
     <div class="space-y-4">
      <!-- Statistics -->
      <div class="bg-slate-800/40 backdrop-blur-sm border border-purple-500/20 rounded-xl shadow-xl overflow-hidden">
       <button onclick="toggleSidebarSection('statistics')" class="w-full p-5 flex items-center justify-between hover:bg-slate-700/30 transition-colors">
        <div class="flex items-center gap-2">
         <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
         </svg>
         <h2 class="font-heading text-lg font-semibold text-purple-300">Statistiken</h2>
        </div>
        <svg id="statistics-arrow" class="w-5 h-5 text-purple-300 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" style="transform: rotate(-90deg);">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg></button>
       <div id="statistics-content" class="px-5 pb-5 space-y-3 text-sm" style="display: none;">
        <div class="flex justify-between">
         <span class="text-gray-400">Zeichen:</span> <span id="stat-chars" class="text-purple-200 font-medium">-</span>
        </div>
        <div class="flex justify-between">
         <span class="text-gray-400">Erstellt:</span> <span id="stat-created" class="text-purple-200 font-medium">-</span>
        </div>
        <div class="flex justify-between">
         <span class="text-gray-400">Bearbeitet:</span> <span id="stat-edited" class="text-purple-200 font-medium">-</span>
        </div>
       </div>
      </div><!-- Categories -->
      <div id="sidebar-categories" class="bg-slate-800/40 backdrop-blur-sm border border-purple-500/20 rounded-xl shadow-xl overflow-hidden hidden">
       <button onclick="toggleSidebarSection('categories')" class="w-full p-5 flex items-center justify-between hover:bg-slate-700/30 transition-colors">
        <div class="flex items-center gap-2">
         <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
         </svg>
         <h2 class="font-heading text-lg font-semibold text-purple-300">Kategorien</h2>
        </div>
        <svg id="categories-arrow" class="w-5 h-5 text-purple-300 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" style="transform: rotate(-90deg);">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg></button>
       <div id="categories-content" class="px-5 pb-5" style="display: none;">
        <div id="sidebar-categories-list" class="space-y-2"></div>
       </div>
      </div><!-- Table of Contents -->
      <div id="sidebar-toc" class="bg-slate-800/40 backdrop-blur-sm border border-purple-500/20 rounded-xl shadow-xl overflow-hidden hidden">
       <button onclick="toggleSidebarSection('toc')" class="w-full p-5 flex items-center justify-between hover:bg-slate-700/30 transition-colors">
        <div class="flex items-center gap-2">
         <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
         </svg>
         <h2 class="font-heading text-lg font-semibold text-purple-300">Inhaltsverzeichnis</h2>
        </div>
        <svg id="toc-arrow" class="w-5 h-5 text-purple-300 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" style="transform: rotate(-90deg);">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg></button>
       <div id="toc-content" class="px-5 pb-5" style="display: none;">
        <div id="sidebar-toc-list" class="space-y-1 text-sm"></div>
       </div>
      </div><!-- Related Pages -->
      <div id="sidebar-related" class="bg-slate-800/40 backdrop-blur-sm border border-purple-500/20 rounded-xl shadow-xl overflow-hidden hidden">
       <button onclick="toggleSidebarSection('related')" class="w-full p-5 flex items-center justify-between hover:bg-slate-700/30 transition-colors">
        <div class="flex items-center gap-2">
         <svg class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewbox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
         </svg>
         <h2 class="font-heading text-lg font-semibold text-purple-300">Verwandte Seiten</h2>
        </div>
        <svg id="related-arrow" class="w-5 h-5 text-purple-300 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" style="transform: rotate(-90deg);">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg></button>
       <div id="related-content" class="px-5 pb-5" style="display: none;">
        <div id="sidebar-related-list" class="space-y-2"></div>
       </div>
      </div>
     </div>
    </aside>
   </main>
  </div>
  <script src="data/categories.js"></script>

  <script src="pages/special.js"></script>

  <script src="important/config.js"></script>
  <script src="important/init.js"></script>
  <script src="important/thing.js"></script>
  
  <script src="js/pages-gen.js"></script>
  <script src="js/infoboxes.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/page-lists.js"></script>
  <script src="js/warnings.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/page-renderer.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/header.js"></script>

    initDropdownPages();
    updatePageCount();
    renderPage('hauptseite');
  </script>
 </body>
